mware, not memory. Note: PIZERO-242 is still open, so this spec may lead it; keep the two in step (changes to that project go through its own session). [2026-10-21 The user does not want the standard too specific (CZ-2 note). This stays useful as a description of the reference firmware's default machine, but it is probably informative rather than a requirement. Lowered to medium and off the roadmap.] [2026-10-21 Deferred 2026-10-21: too detailed for the sparse spec the user described (CZ-2 note: like the rules for a kei car or a US mailbox, only the general shape). This is implementation detail, which belongs with an implementation such as the reference firmware, not in the standard. Reopen only if the user asks.]", "type": "spec", "status": "deferred", "priority": "medium", "tags": ["spec", "machine"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-6", "summary": "Form factor: adopt the Raspberry Pi Zero mechanical outline (spec/form-factor.md)", "description": "The 'Zero' in CoCo Zero is the Raspberry Pi Zero board size, adopted as the CoCo Zero form factor the way every CoCo 2 variant shared one motherboard size (user, 2026-10-21). Source: Raspberry Pi's mechanical drawings, Pi Zero ref RPI-ZERO-V1_2 (2015) and Zero 2 W (same dimensions), at datasheets.raspberrypi.com/rpizero/raspberry-pi-zero-mechanical-drawing.pdf and rpizero2/raspberry-pi-zero-2-w-mechanical-drawing.pdf. Linked, not copied (their drawing; trademark note in the spec). Values: 65 x 30, corner radius 3.0, 4 x M2.5 holes drilled 2.75 +/- 0.05 on a 58 x 23 pattern 3.5 in from each edge; mini HDMI centre x 12.4, micro USB centres 41.4 and 54.0 on the connector edge, microSD at the short edge centre y 16.9, 40-pin header centred x 32.5. Compared with the reference board from ~/github/xroar-waveshare-rp2350-pizero/hardware/case/pizero_case.scad (scaled off Waveshare's drawing, +/- 0.2): outline, insets, HDMI (12.35) and microSD (16.9) match; holes about 3.0; USB-C centres 39.1 and 53.6, so the first USB moves 2.3 mm. [2026-10-21 Drafted spec/form-factor.md: outline and holes required; connector positions a recommendation until the open question is settled.] OPEN: must connector positions be exact enough that every CoCo Zero fits one case (the CoCo 2 analogy says yes), or are outline and holes enough? Also not covered yet: board thickness and height envelope, keep-outs (latched microSD tail), buttons, LED. DONE WHEN: the user agrees the required table and the connector question is decided; the height envelope can be filed as its own issue. [2026-10-21 Connector question decided by the user: every CoCo Zero should fit the same case, but the spec says nothing about connector positions; some cases may need minor modifications, and most will be 3D printed anyway. The user also set the tone: 'it's a spec not a commentary about what you may see on the street.' spec/form-factor.md cut down to the source drawing and the requirements table (outline, corner radius, holes). Removed: the connector table, the comparison with the reference board, and the rationale; the CoCo 2 analogy belongs in the vision page (CZ-2). Height envelope and keep-outs filed as CZ-20. Waiting on the user's read of the page to close.] [2026-10-21 Closed on the user's word. Delivered: spec/form-factor.md, the Pi Zero outline, corner radius and mounting holes from Raspberry Pi's drawing, requirements only. Deliberately not done: connector positions (left out by decision). Remainder: CZ-20 (thickness, height, keep-outs).]", "type": "spec", "status": "done", "priority": "high", "tags": ["spec", "hardware", "form-factor"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-7", "summary": "User-facing interface standard: SD card layout, settings files, keys and gamepad", "description": "The part that lets a card, a game's settings file or a user's habits move between CoCo Zero implementations. spec/interface.md, sourced from the reference project's README.md, SETTINGS.md and AUTORUN.md: the card layout (/coco/roms, /coco/dsk, /coco/bin, /coco/cart, /coco/log), ROM file names, settings.txt syntax and precedence (profile defaults < settings.txt < the game's own NAME.TXT beside it), autorun.txt, the list keys (F9 programs, F10 cartridges, F11 files, F12 disks, gamepad Home), the default gamepad-to-joystick mapping, Print Screen screenshots, and the statement that ROMs are never shipped. Decide which keys are required and which are recommended. [2026-10-21 Lowered to medium: the user wants the standard light on specifics. Likely a recommendation for implementers rather than a requirement.] [2026-10-21 Deferred 2026-10-21: too detailed for the sparse spec the user described (CZ-2 note: like the rules for a kei car or a US mailbox, only the general shape). This is implementation detail, which belongs with an implementation such as the reference firmware, not in the standard. Reopen only if the user asks.]", "type": "spec", "status": "deferred", "priority": "medium", "tags": ["spec", "interop"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-8", "summary": "Design principles", "description": "docs/principles.md: the rules that explain the spec's choices, so future decisions follow the same grain. Candidates from the reference project: improvements on by default, authentic behaviour always one setting away and settable per game; everything works on hardware before it is claimed; fully open source in the XRoar tradition; ROMs are the owner's to supply; it plugs into a modern TV with things people already own; a playground for developers, where limits need not be practical if within reach (PIZERO-176). Confirm each with the user. DEPENDS ON CZ-2. [2026-10-21 Bare metal is now a core principle (CZ-18): zero operating system, one layer of software between the user and the machine.] [2026-10-21 The user's model for this repo (2026-10-21): the main documentation is very sparse. It does not tell you how to build a CoCo Zero beyond the general shape. Think of the rules for a kei car or a US mailbox, or a computer case standard: it leaves the most room for DIY builders to adapt it and make it what they want, while letting them depend on third-party manufacturers for the electronics. First principle; the others follow from it. Candidates that are implementation advice (improvements on by default, keycap typing) may belong to the reference project instead of here.] [2026-10-25 Drafted as docs/principles.md from what is already settled, seven principles: fix the outside and leave the inside (first, per the sparse-spec note); zero operating system (CZ-18); look forward (the user on the extras graphic: modern convenience, not looking to the past); open (CZ-22, CZ-4); bring your own ROMs (README); for everyone (CZ-23); only what is true (the reference rule 'works on hardware before it is claimed', and CZ-27). Left out as implementation advice for the reference project, per the earlier note: improvements on by default with authentic behaviour one setting away, and keys typing what is printed on them. Also left out: 'a playground for developers, limits need not be practical' (reference PIZERO-176); ask the user whether it belongs. Linked from the end of the README vision section.] [2026-10-25 Closed with the user, with the seven principles as drafted. The playground question is filed as CZ-28.]", "type": "docs", "status": "done", "priority": "medium", "tags": ["vision", "principles"], "created": "2026-10-21", "updated": "2026-10-25"}, {"id": "CZ-9", "summary": "Implementations registry, starting with the reference firmware", "description": "implementations/README.md: each known implementation, its board, its source link, which spec version and extensions it claims, and its status. First entry: the reference firmware (~/github/xroar-waveshare-rp2350-pizero (github.com/ugufru/xroar-waveshare-rp2350-pizero)). Candidates to ask the user about: the other XRoar ports in ~/github (xroar-adafruit-rp2350-fruit-jam, xroar-waveshare-rp2350-43b, coco-rp2350-waveshare-touch-amoled-18, xroar-waveshare-144-inch-lcd-hat) and cocozero-emulator. Whether any of them count depends on CZ-4. [2026-10-21 Since any Pi Zero size board can qualify (CZ-2), the registry also lists boards. Candidates to verify against CZ-6 and CZ-16: Waveshare RP2350-PiZero (reference), Orange Pi Zero 2W, Radxa Zero, Banana Pi M2 Zero. Check each one's video connector, since some Zero size boards use micro HDMI.] [2026-10-21 Bare metal (CZ-18) matters for the candidate boards: Orange Pi, Radxa and Banana Pi Zero boards are application processors normally run with Linux. They qualify only with firmware that runs without an OS (bare-metal frameworks such as Circle do this on the Pi Zero 2 W), so the registry lists implementations (board plus firmware), not bare boards.] [2026-10-25 Written as implementations/README.md: one table (implementation, board, firmware, source, license) and how to add a row (an issue or pull request saying how it meets each spec page). One entry, the reference: Waveshare RP2350-PiZero, XRoar, github.com/ugufru/xroar-waveshare-rp2350-pizero, GPL 3 or later (its LICENSE file, checked). Left out on purpose: a spec version column (there are no spec versions yet, CZ-11) and a firmware version (it would go stale). Not listed: the Fruit Jam, RP2350-43B and AMOLED XRoar ports in ~/github, none of which is a Pi Zero size board; ~/github/xroar-waveshare-144-inch-lcd-hat, which despite its name is an older checkout of the reference itself (its upstream remote is the reference repo, last commit 2026-09-27, CoCo 2 only, so it does not meet CZ-19); and the Orange Pi, Radxa and Banana Pi Zero boards, which have no known bare-metal CoCo firmware (CZ-26). The README's reference section links to the page.] [2026-10-25 Closed with the user.]", "type": "docs", "status": "done", "priority": "medium", "tags": ["implementations"], "created": "2026-10-21", "updated": "2026-10-25"}, {"id": "CZ-10", "summary": "Conformance checklist and test programs", "description": "A checklist an implementer walks through to claim the name, each line mapped to a MUST/SHOULD in the spec, with small test programs (BASIC listings in markdown, plus .bas/.bin files) that exercise the cocozero profile: palette and timer registers, SN76489 tones, lower case, the 60 Hz IRQ. Reuse what the reference project already proved on hardware (its coco3-checks and docs/coco3-titles.md) instead of inventing new tests. DEPENDS ON CZ-4, CZ-5. [2026-10-21 Deferred 2026-10-21: too detailed for the sparse spec the user described (CZ-2 note: like the rules for a kei car or a US mailbox, only the general shape). This is implementation detail, which belongs with an implementation such as the reference firmware, not in the standard. Reopen only if the user asks.]", "type": "spec", "status": "deferred", "priority": "medium", "tags": ["conformance", "testing"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-11", "summary": "Versioning and change process for the standard", "description": "spec/versioning.md: how the spec is numbered (e.g. 1.0 when CZ-3 to CZ-7 are agreed), what counts as a breaking change, how a change is proposed (an issue here, then a pull request on the public repo), and who decides. Keep it light: one maintainer today. [2026-10-25 Drafted as docs/versioning.md, not spec/ as first planned, since spec/ holds only requirements. MAJOR.MINOR for the whole of spec/: major for a change that could stop an existing CoCo Zero conforming (a new or tighter requirement), minor for any other requirement change, none for changes outside spec/ or fixes that leave requirements as they were. Changes: an issue, then a pull request (CONTRIBUTING.md). The maintainer, ugufru, decides. Proposed current version 1.0, since every spec page is accepted; this is the user's call. The version is read by tools/spec_pdf.py into the PDF header ('The standard, version 1.0') and stated in the README's The standard section. No git tags.] [2026-10-25 Closed with the user, at version 1.0.]", "type": "process", "status": "done", "priority": "medium", "tags": ["governance"], "created": "2026-10-21", "updated": "2026-10-25"}, {"id": "CZ-12", "summary": "Beyond the CoCo: the list of things a CoCo Zero does that the original CoCos never did", "description": "From the user, 2026-10-21: a CoCo Zero does extra things the traditional CoCos never did; that is part of what makes it special, and the list will grow over time. spec/extras.md: each extra with a short name, a one-line description, and whether it is part of the identity (every CoCo Zero has it) or optional (an implementation declares it). Kept light, per the user's wish not to be too specific. Seeded from the reference firmware (~/github/xroar-waveshare-rp2350-pizero README.md): picture and sound over one cable at 60 fps on a modern TV; USB keyboard where each key types what is printed on it, and USB gamepads as joysticks; disks, programs and cartridges picked from on-screen lists off a microSD card; settings per game, and a game that switches the machine to a CoCo 3 by itself; screenshots to the card; a game that starts at power-on (autorun); the CoCo 2 high-speed POKEs with a clean screen; true lower case and a choice of fonts; the GMC's SN76489 sound chip built in; the GIME palette and timer on the CoCo 2 (the cocozero profile, CZ-5); NitrOS-9 boot disks built by a script. Ideas in the reference tracker, not shipped: an MC6845 80-column card (PIZERO-176). Also folds in the earlier 'extensions registry' idea (memory beyond 128K is covered by CZ-19). [2026-10-21 The comparison rows in docs/comparison.md (CZ-15) are a good user-facing statement of these extras: picture, sound, speed, storage, loading, text, keyboard, joysticks, screenshots, settings, size and power, two machines on one board.] [2026-10-21 Per the sparse-spec model (CZ-2 note): this lives in docs/, not spec/. It describes what CoCo Zeros do; it requires nothing.] [2026-10-25 Written as docs/extras.md (docs, not spec, per the sparse-spec note). Two lists in place of an identity/optional flag per item: 'On every CoCo Zero' (only what follows from spec/: one mini HDMI cable to a TV, a USB keyboard, microSD, loading from the configuration screen, USB-C power, Pi Zero size) and 'In the reference CoCo Zero' (from the reference firmware README's What it does section, read 2026-10-25: three machines, high-speed POKEs, lower case and fonts, the GMC, PSG, Symphony-12 and Orchestra-90CC sound built in, CoCo 3 palette and timer on the CoCo 2, keys as printed with auto-repeat, gamepad, USB headphones, settings files, screenshots, autorun, NitrOS-9, the case). Left out: double speed with a steady picture, since the CoCo 3 already did that; a USB gamepad on the every-CoCo-Zero list, since the spec requires only a keyboard. The README's 'A CoCo, and more' paragraph links to it.] [2026-10-25 Closed with the user.]", "type": "spec", "status": "done", "priority": "medium", "tags": ["spec", "extensions", "extras"], "created": "2026-10-21", "updated": "2026-10-25"}, {"id": "CZ-13", "summary": "Name, logo and trademark guidance", "description": "docs/name.md: where the name came from (a cute name for a Pi Zero sized RP2350 port, kept as a generic name once the CoCo 3 arrived), how others may use 'CoCo Zero' and any 'compatible' wording, and a plain note that Tandy, Color Computer and the ROMs belong to their owners. Not legal advice. Ask the user whether a logo or badge exists or is wanted.", "type": "docs", "status": "open", "priority": "low", "tags": ["governance", "name"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-14", "summary": "Glossary and background for newcomers", "description": "docs/glossary.md and a short background page: CoCo 1/2/3, 6809, SAM, VDG (MC6847), GIME, PIA, SN76489 and the Games Master Cartridge, artifact colours, Color/Extended/Disk/Super Extended BASIC, NitrOS-9, XRoar, RP2350, DVI vs HDMI wording (the reference project avoids the HDMI name in user text, its PIZERO-174). Links over long explanations.", "type": "docs", "status": "open", "priority": "low", "tags": ["docs"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-15", "summary": "Markdown comparison: CoCo 2 and CoCo 3 against the CoCo Zero", "description": "A markdown version of the reference project's docs/coco2-vs-coco-zero.html and docs/coco-comparison.html (its PIZERO-235), as a table that renders on GitHub. Every CoCo Zero claim must be something the reference firmware ships. Good first impression page, linked from the README. DEPENDS ON CZ-3 for wording. [2026-10-21 Written as docs/comparison.md, a three-column markdown table (CoCo 2, CoCo 3, CoCo Zero), 13 rows, adapted from the reference docs/coco-comparison.html with the CoCo 2 page's case line. Changes: 'What came next' updated to one firmware that is both machines (reference PIZERO-135; the HTML still said experimental); the CoCo Zero speed and text rows include the CoCo 3; a new row 'Between you and the machine' carries the bare-metal idea (CZ-18). The CoCo Zero column is stated to describe the reference implementation. Waiting on the user's read. The reference pages themselves are a bit out of date; changing them is for that project's session.] [2026-10-25 Closed with the user's agreement. docs/comparison.md is linked from the README twice ('A CoCo, and more' and the CZ-1 images). Updating the reference project's own out-of-date HTML pages remains that project's business.]", "type": "docs", "status": "done", "priority": "medium", "tags": ["docs"], "created": "2026-10-21", "updated": "2026-10-25"}, {"id": "CZ-16", "summary": "Feature baseline: what every CoCo Zero board provides", "description": "spec/features.md. The user named USB-C, mini HDMI and microSD as the features that stand out (2026-10-21), and does not want the standard too specific. Proposed baseline, to confirm with the user, each as MUST unless noted: (1) mini HDMI video, with sound carried in the same cable and no separate audio jack; (2) two USB-C ports, one for power and firmware updates, one USB host port for a keyboard and gamepad (the Pi Zero splits its two micro USB ports the same way); (3) a microSD slot, the machine's disk drive and settings; (4) runs from an ordinary USB-C phone charger and powers the keyboard and gamepad from it; (5) firmware updates over USB-C with no special tools (SHOULD); (6) a reset button reachable in a case (SHOULD); (7) the 40-pin header footprint in the Pi Zero position, populated or not (MAY), which would let a pHAT-size add-on act as a CoCo Zero expansion, the CoCo's cartridge port in this form; (8) a status LED (MAY); (9) open source firmware in the XRoar tradition, ROMs supplied by the owner. Ruled out for now: naming a particular microcontroller (the RP2350 is the reference board's, not a requirement). The spec names the connectors, never their positions (CZ-6). Write it as requirements only, with no commentary (user, 2026-10-21). [2026-10-21 Add from CZ-18: boots straight into the emulated machine, with no operating system; the only other software is the monitor and configuration screen.] [2026-10-21 Per the sparse-spec model (CZ-2 note): cut the list to what defines a CoCo Zero, which the user named: mini HDMI, USB-C, microSD; plus bare metal (CZ-18) and emulating a CoCo (CZ-19). Drop the SHOULD/MAY items (firmware update method, reset button, LED, 40-pin footprint, phone charger power) unless the user wants one; they are builders' choices.] [2026-10-21 User's requirements: support for standard USB-C keyboards; no micro USB or any other USB, USB-C only ('both perfect connector standards'); same for mini HDMI; at least one USB-C port for power and at least one USB-C port hosting USB peripherals; 640p60 output to HDMI with audio; fanless: 'let's keep those linux pis in disguise out of our cases. All CoCo Zeros are passively cooled and quiet.' Drafted spec/features.md with sections Connectors, Video and sound, Performance (CZ-21), Cooling; microSD kept from the user's earlier list. Read 'any other usb' as every USB port on the board being USB-C, and 'same for mini hdmi' as the video output being mini HDMI only (not micro or full-size). Waiting on the user's read.] [2026-10-21 User revised USB: 'just require two USB ports, as we need one for power and programming.' spec/features.md now requires two USB-C ports, one for power and programming, one a USB host for peripherals; the line 'every USB port is USB-C' is gone, so the spec says nothing about further ports.] [2026-10-21 Closed on the user's word. Delivered: spec/features.md Connectors (two USB-C ports, one for power and programming and one USB host; a standard USB-C keyboard works; mini HDMI; microSD), Video and sound (640x480 at 60 Hz over HDMI with sound in the signal) and Cooling (passive, no fan). Deliberately not done: the optional items (reset button, LED, 40-pin footprint, firmware update method). Bare metal and the machines are CZ-18 and CZ-19.]", "type": "spec", "status": "done", "priority": "high", "tags": ["spec", "hardware", "features"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-17", "summary": "Expansion header: a CoCo Zero add-on board on the 40-pin footprint", "description": "Idea from the CZ-16 baseline, 2026-10-21. The Pi Zero's 40-pin header (and the pHAT add-on size that grew around it) is the natural place for a CoCo Zero expansion, the way the CoCo had its cartridge port. Explore whether a pinout convention is worth defining (for example a joystick port, a cassette or serial port, a real cartridge bridge), and whether to follow Raspberry Pi's HAT+ conventions (an ID EEPROM). Exploration only: nothing is decided, and the reference board's header use should be checked before proposing pins. [2026-10-21 Deferred 2026-10-21: too detailed for the sparse spec the user described (CZ-2 note: like the rules for a kei car or a US mailbox, only the general shape). This is implementation detail, which belongs with an implementation such as the reference firmware, not in the standard. Reopen only if the user asks.]", "type": "spec", "status": "deferred", "priority": "low", "tags": ["spec", "hardware", "extensions"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-18", "summary": "Bare metal: zero operating system, one layer of software between you and the machine", "description": "The second meaning of 'Zero', from the user 2026-10-21: there is zero operating system to get in the way. Just a lightweight monitor and configuration screen that does not run anything else; just you and the machine, with one layer of software between. The CoCo Zero approximates that as closely as possible while keeping the essence of what it means to operate a CoCo. The user wants to deepen this idea later, so this issue starts by writing down what was said (docs/bare-metal.md or a section of the vision page) and collecting questions for that conversation, for example: what the monitor and configuration screen may and may not do; whether it counts as part of the 'one layer'; whether a real-time library or SDK (the reference uses the arduino-pico core) is acceptable where an OS is not; what 'the essence of operating a CoCo' requires (power on to BASIC in seconds, nothing to log in to, nothing to shut down?). Implication already noted: Linux-class Zero size boards qualify only with bare-metal firmware (CZ-9). [2026-10-25 From the user: the one screen beside the CoCo is a configuration screen for a few XRoar options, including mounted DSK images, system information, and a way to load programs and cartridges directly. Written as spec/zero-os.md: firmware on the bare hardware with no operating system; one configuration screen that may set emulator options, mount disk images, show system information, and load programs and cartridges; the firmware runs nothing else. The spec says emulator, not XRoar, since a CoCo Zero need not be built on XRoar; disk images, not DSK, to stay format-neutral. Added to the README spec table (the 'More is on the way' line is gone, nothing is left on it), linked from the definition's Zero operating system trait, and added to the PDF, which now sets the Features section in two columns to stay on one page. Left for later, not decided: whether a hardware SDK or support library (the reference uses the arduino-pico core) counts as an operating system; the spec's plain reading is that a library is not one.] [2026-10-25 Closed with the user. The open question about support libraries is filed as CZ-26.]", "type": "spec", "status": "done", "priority": "medium", "tags": ["spec", "vision", "bare-metal"], "created": "2026-10-21", "updated": "2026-10-25"}, {"id": "CZ-19", "summary": "Machines and memory: a CoCo 1, 2 or 3, from 128K up to 512K, 2M and more", "description": "From the user, 2026-10-21: a CoCo Zero emulates a CoCo 1, 2 or 3; the CoCo 3 at 128K, but ideally 512K, 2M and more. spec/machines.md. To settle: whether an implementation must offer all three machines or at least one (the reference firmware does the CoCo 2 and a 128K CoCo 3, and a CoCo 1 is close to a CoCo 2 with the older ROMs); whether 128K is the floor and 512K the recommendation; how memory beyond 512K is described, since 2M CoCo 3 upgrades are third-party designs and need a named model to emulate. Reference facts: the RP2350-PiZero has 520 KB SRAM and no PSRAM fitted, which is why the reference stops at 128K; fitting PSRAM is under discussion with Waveshare (reference docs/supplier-primer.md, PIZERO-243). Keep each machine's description short; the cocozero profile (CZ-5) is a machine variant and belongs here as a link. [2026-10-21 Per the sparse-spec model (CZ-2 note): a few lines naming the machines and memory sizes, not a description of each machine.] [2026-10-25 Settled by the user: a 128K CoCo 3 is the minimum implementation; 64K is the minimum configuration for a CoCo 1 or 2. Read as: every CoCo Zero emulates a CoCo 3 with at least 128K, and a CoCo 1 or 2 is optional but has at least 64K when offered. Written as spec/machines.md (two requirements, nothing else) and added to the README spec table; the README vision line now reads 'at least a 128K CoCo 3, and ideally 512K, 2M or more. It can be a 64K CoCo 1 or 2 as well.' Deliberately not in the spec: 512K and 2M stay as the README's 'ideally', not a recommendation level, since spec pages carry requirements only (CZ-6); which 2M upgrade model to emulate is left to the builder. The cocozero profile (CZ-5, deferred) is not linked yet. Waiting on the user's read.] [2026-10-25 Closed: the user read spec/machines.md and the README changes and approved them.]", "type": "spec", "status": "done", "priority": "high", "tags": ["spec", "machine"], "created": "2026-10-21", "updated": "2026-10-25"}, {"id": "CZ-20", "summary": "Form factor remainder: board thickness, height envelope and keep-outs", "description": "Remainder of CZ-6. A case also needs to know how thick the board is and how tall its parts stand above and below it, and what space must stay clear (for example the tail of a latched microSD card, which stands 3.90 mm out of the housing on the reference board per ~/github/xroar-waveshare-rp2350-pizero/hardware/case/README.md). Decide with the user whether any of this belongs in the spec at all: CZ-6 settled that the spec carries only what is required and no commentary, and left connector positions out entirely. If something goes in, it is a hard limit, for example a maximum height that the reference case accommodates (18.6 mm overall case height; PCB thickness 1.6 marked unconfirmed in pizero_case.scad). Buttons and the status LED belong to CZ-16, not here. [2026-10-21 The kei car and mailbox model (CZ-2 note) does have size limits, so a maximum height may fit the spec if the user wants one; nothing else here does.]", "type": "spec", "status": "open", "priority": "low", "tags": ["spec", "hardware", "form-factor"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-21", "summary": "Performance minimums: double speed, 60 Hz, 640x480", "description": "From the user 2026-10-21: performance specs belong in the standard, for example 'a CoCo Zero should be able to clock double speed at 60hz at 640x480 resolution. stuff like that.' Like the size limits in a kei car rule, these are hard numbers a builder must meet, not advice on how. spec/performance.md (or a section of spec/features.md if it stays short). Requirement as stated: real-time emulation at double speed (the 6809 at about 1.79 MHz: the CoCo 3's fast mode, the CoCo 2's POKE 65497,0) while putting out 640x480 at 60 Hz. Reference facts (~/github/xroar-waveshare-rp2350-pizero README.md, Performance): the reference meets this on an RP2350 at 252 MHz, standard 640x480p60 (25.2 MHz pixel, 800x525), a locked 60 fps; as a CoCo 3 at 1.79 MHz at most 15.2 ms of the 16.67 ms frame; the CoCo 2's POKE 65497,0 about 12.6 ms. Candidates to put to the user, each a number not a method: no dropped or repeated frames; sound with no gaps; power-on to the BASIC prompt within a few seconds; keyboard and gamepad input within a frame or two. Keep to the few the user accepts. Wording to settle: 'double speed' measured as the emulated CPU clock, and whether 60 Hz means the video output, the emulated machine's frame rate, or both (the reference does both). [2026-10-21 User's answers: quick power-on, yes; no dropped frames and no sound gaps, yes; '640p60 output to hdmi with audio', so 60 Hz means the HDMI output. Input latency was not taken up, so dropped. Drafted as the Performance section of spec/features.md (short enough not to need its own page). OPEN: the number of seconds for power-on to BASIC (left as N; the reference README says the OK prompt appears 'after a few seconds').] [2026-10-21 User: 'let's not specify how long.' No time limit. spec/features.md now says 'Power-on goes straight to the BASIC prompt', keeping the quick power-on the user wanted without a number. No open questions left; waiting on the user's read of the page.] [2026-10-21 Closed on the user's word. Delivered: the Performance section of spec/features.md: real time at double speed (about 1.79 MHz), no dropped frames, no gaps in the sound, power-on straight to the BASIC prompt. Deliberately not done: a time limit for power-on and an input latency figure, both declined by the user.]", "type": "spec", "status": "done", "priority": "high", "tags": ["spec", "performance"], "created": "2026-10-21", "updated": "2026-10-21"}, {"id": "CZ-22", "summary": "LICENSE and CONTRIBUTING.md", "description": "Remainder of CZ-1 and CZ-2 (question 4). The repo is public at github.com/ugufru/coco-zero but has no LICENSE and no CONTRIBUTING.md. To settle with the user: the license for the documents (CC BY-SA 4.0 was floated in CZ-2; the README images include a third-party photo, docs/images/coco2.jpg, which is 'copyrighted free use' and credited in the README, so it needs no special handling), and whether the standard requires implementations to be open source the way XRoar is (GPL). The README already says the reference firmware is completely open source, which is a description, not a requirement. CONTRIBUTING.md: how to propose a change (an issue, then a pull request), kept light; the user's baseline contribution policy is available through the contributing skill and may simply be stamped in. Overlaps CZ-11 (versioning and change process): keep CONTRIBUTING.md to the mechanics and leave numbering and breaking changes to CZ-11. DONE WHEN: both files exist at the repo root and the README mentions the license. [2026-10-25 CONTRIBUTING.md stamped from the user's baseline policy (contributing skill), with the tracker line pointing at issues.jsonl, roadmap.jsonl and issues.html. Waiting on the user's review of it, and on the license choice.] [2026-10-25 Closed. The user chose CC BY 4.0 for the documents. LICENSE is the official legal code text from creativecommons.org/licenses/by/4.0/legalcode.txt, unmodified. The README has a License section (CC BY 4.0, with docs/images/coco2.jpg excepted as a third-party photo under its own terms) and links CONTRIBUTING.md from the tracker paragraph. CONTRIBUTING.md is the baseline policy as stamped, accepted by the user with the commit. Not decided here: whether the standard requires implementations to be open source; moved to CZ-4, where it is a qualification question.]", "type": "chore", "status": "done", "priority": "medium", "tags": ["scaffolding"], "created": "2026-10-25", "updated": "2026-10-25"}, {"id": "CZ-23", "summary": "Intended audience: builders, software developers, or both", "description": "Remainder of CZ-2 (question 5), the one vision question not yet answered. Who the standard is written for decides tone and depth across the repo: DIY builders choosing a board and case, developers writing software for a CoCo Zero, people who just want to play, or a mix. The README currently speaks mostly to builders ('leaves the most room for DIY builders') and to players (the comparison page). Ask the user, then adjust the README vision section if needed; no separate vision page (CZ-2 settled that the README is the vision). Feeds CZ-3 (definition) and CZ-14 (glossary, which only matters if newcomers are in the audience). [2026-10-25 Answered by the user: both builders and developers, as well as retro gamers and anyone curious enough about the CoCo to spend $20. Added to the README vision as a 'For everyone.' paragraph before 'Quiet.', in the user's words ('spend $20 finding out'). The $20 is the user's figure and is not explained further in the README. Consequence: newcomers are in the audience, so the glossary (CZ-14) is worth writing; its roadmap reason is updated.] [2026-10-25 Closed with the user.]", "type": "docs", "status": "done", "priority": "low", "tags": ["vision"], "created": "2026-10-25", "updated": "2026-10-25"}, {"id": "CZ-24", "summary": "One-page PDF of the spec, as an alternative to the GitHub pages", "description": "From the user, 2026-10-25: provide a one-page PDF as an alternative to the website. No fluff, just the spec. Plan: tools/spec_pdf.py, a dependency-free Python script (this machine has pandoc but no PDF engine, and Chrome is off limits) that reads spec/form-factor.md, spec/machines.md and spec/features.md and writes spec/coco-zero-spec.pdf on one US Letter page with the standard Helvetica fonts. It carries only the requirements: Status lines and the form factor Source section are left out; a footer gives the repo URL, the date of the last spec change, CC BY 4.0, and the Raspberry Pi trademark line. The script fails rather than spill onto a second page. The PDF is committed, and the README links to it. Regenerate after any spec change. DONE WHEN: the user has opened the PDF and is happy with it. [2026-10-25 Closed with the user. spec/coco-zero-spec.pdf and tools/spec_pdf.py shipped in 0d7f857 and were regenerated for CZ-25 in 7577e0b. Regenerate after any spec change.]", "type": "docs", "status": "done", "priority": "medium", "tags": ["spec"], "created": "2026-10-25", "updated": "2026-10-25"}, {"id": "CZ-25", "summary": "HDMI names only the connector and cable; the signal is DVI with embedded audio", "description": "From the user, 2026-10-25: HDMI is a licensed term the project cannot afford. A CoCo Zero does not produce HDMI signals: the signal is DVI with embedded audio. The physical connector and cable are mini HDMI, and the standard calls them that, because that is what people buy cables and adapters by; HDMI is not used for anything else. (The formal connector name, HDMI Type C, is the same trademark, and no neutral standard name exists, so it was dropped rather than replaced.) Changed: spec/features.md (connector line now 'a mini HDMI connector'; video section now '640 x 480 at 60 Hz, as a DVI signal' and 'Sound is embedded in the DVI signal'), the README spec table ('DVI with embedded sound'), and the regenerated spec/coco-zero-spec.pdf. Left as they are, since they name the connector or cable: the README image alt texts (mini HDMI cable, adapter, port) and the Mini HDMI tile in docs/images/coco-and-more.svg. Not changed: historical notes in issues.jsonl and past commits. The reference project made a similar call (its PIZERO-174) and is that project's business. [2026-10-25 Closed with the user. Shipped in 7577e0b.]", "type": "docs", "status": "done", "priority": "high", "tags": ["spec", "naming"], "created": "2026-10-25", "updated": "2026-10-25"}, {"id": "CZ-26", "summary": "Does a hardware support library count as an operating system?", "description": "Remainder of CZ-18. spec/zero-os.md requires firmware on the bare hardware with no operating system, and allows one configuration screen beside the emulated CoCo. It does not say whether a hardware SDK or support library counts as an operating system. The reference firmware is built on the arduino-pico core (over the Raspberry Pi Pico SDK), which supplies startup, USB and timing but no scheduler, processes or shell. The plain reading of the spec is that a library is not an operating system, so the reference conforms. Ask the user whether that needs saying in the spec, for example by naming what makes something an operating system (processes, a scheduler, a shell, a filesystem layer for applications), or whether the plain reading is enough and this closes with no change. Also relevant to Linux-class Zero size boards (CZ-9): bare-metal frameworks such as Circle on the Pi Zero 2 W are libraries in the same sense.", "type": "spec", "status": "open", "priority": "low", "tags": ["spec"], "created": "2026-10-25", "updated": "2026-10-25"}, {"id": "CZ-27", "summary": "The reference case is styled after the CoCo 2, not shaped like one", "description": "The user pointed out that 'a printable case shaped like a CoCo 2' is not true. The reference case is a small two-part box (69.8 x 34.8 x 18.6 mm) whose lid carries vent slots styled after the ventilated top of a Tandy Color Computer 2, which is how the reference project's own hardware/case/README.md describes it. Fixed in four places: the README's top photo alt text ('its lid vented like a CoCo 2's'), the README's reference section, docs/extras.md and the CoCo Zero column of docs/comparison.md ('styled after the ventilated top of a CoCo 2'). Not changed here: the reference project's own README, which still says 'shaped like a CoCo 2' on its line 60; that is the reference project's session to fix. [2026-10-25 Closed with the user.]", "type": "docs", "status": "done", "priority": "medium", "tags": ["accuracy"], "created": "2026-10-25", "updated": "2026-10-25"}, {"id": "CZ-28", "summary": "Principle candidate: a playground for developers", "description": "Remainder of CZ-8. From the reference project (its PIZERO-176), in the user's words: 'CoCo Zero is like a little playground for developers, and our limits do not always need to be practical if they are within reach.' It was left out of docs/principles.md because it was said about the reference firmware, not the standard, and it was not confirmed for this repo. Ask the user whether it belongs as an eighth principle, and if so how it sits beside 'Fix the outside, leave the inside' (a playground suggests going beyond the spec, which the sparse spec already allows). Closes with no change if the answer is no.", "type": "docs", "status": "open", "priority": "low", "tags": ["principles"], "created": "2026-10-25", "updated": "2026-10-25"}, {"id": "CZ-29", "summary": "USB joystick, hub and audio requirements (and the definition's gamepad)", "description": "Found while closing CZ-11. The definition paragraph (spec/definition.md, also the README opening and the top of the PDF) says a CoCo Zero 'takes a USB keyboard and gamepad'. spec/features.md requires only that 'a standard USB-C keyboard works when plugged into the host port'; docs/extras.md accordingly lists the gamepad under the reference CoCo Zero, not every CoCo Zero. Under docs/versioning.md, adding a gamepad requirement could stop an existing CoCo Zero conforming, so it would make the standard 2.0; dropping 'and gamepad' from the paragraph changes no requirement and no version. Ask the user which. Principle 7 (only what is true) says the two must agree either way. [2026-10-25 The user chose the spec side, and more: a USB joystick, USB hubs and class-compliant USB audio are part of the spec. spec/features.md has a new USB devices section: the keyboard line (moved from Connectors, wording unchanged), a USB joystick or gamepad works as the CoCo's joysticks, a keyboard and joystick work together through a simple USB hub (one with a single hub chip), and a class-compliant USB audio device can play the sound in place of the video cable. Worded so the reference still conforms, checked against its README and docs/sound.md on 2026-10-25: gamepad yes; simple hubs yes but hubs with several hub chips not yet, hence 'simple'; UAC1 and UAC2 playback yes, detected at power-on, and the spec does not require hot-plugging. New requirements make this a major change: the standard is now 2.0 (docs/versioning.md, README). The definition paragraph is now true as written. docs/extras.md moves joystick, hub and USB audio to the every-CoCo-Zero list. tools/spec_pdf.py: body text 10 pt on 12.5 pt (was 10.5 on 13.5), section spacing 22, bottom limit 74, the two-column split now chooses the most even columns, and a parser fix so a bullet's wrapped Markdown line stays in the bullet.] [2026-10-25 Closed with the user, at version 2.0.]", "type": "spec", "status": "done", "priority": "medium", "tags": ["spec", "accuracy"], "created": "2026-10-25", "updated": "2026-10-25"}], "roadmap": [{"rank": 1, "id": "CZ-13", "why": "Matters once other builders use the name. HDMI wording is settled (CZ-25); this covers the CoCo Zero name itself.", "added": "2026-10-25"}, {"rank": 2, "id": "CZ-20", "why": "May end up as nothing: the spec carries only hard limits. One question for the user, whether a maximum height belongs in it.", "added": "2026-10-25"}, {"rank": 3, "id": "CZ-14", "why": "Newcomers are in the audience (CZ-23: anyone curious enough to spend $20), so this is worth writing; it comes last because it explains terms the other pages settle.", "added": "2026-10-25"}]}</script>
<script>
(function () {
  var STATUS_ORDER = ['open', 'in-progress', 'done', 'deferred', 'wontfix'];
  var PRIORITY_ORDER = ['high', 'medium', 'low'];
  var TAG_PILL_LIMIT = 20;   // the rest hide behind a "+N more" toggle
  // Themes are the coarse grouping: one per issue, from a fixed vocabulary,
  // unlike the free-form tags. Order is the order they are worked in.
  var THEME_ORDER = ['trust', 'kit', 'input', 'experience', 'platform', 'storage', 'devices'];
  var LIVE = ['open', 'in-progress'];
  var KEY = 'issues-view:' + location.pathname;
  // Longest alternative first: "jsonl" must win over "json".
  var PATH_RE = /\b((?:[\w.-]+\/)*[\w.-]+\.(?:jsonl|json|md|html|css|js|ts|tsx|jsx|py|rb|go|rs|java|c|h|cpp|sh|toml|ya?ml|cfg|ini|txt|bas|dsk|png))(:\d+(?:-\d+)?)?/g;

  var issues = [];
  var active = { status: [], type: [], tag: [], theme: [] };
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function rank(v, order) {
    var i = order.indexOf(v);
    return i === -1 ? order.length : i;
  }

  function markup(text) {
    return String(text).split('\n\n').map(function (para) {
      return '<p>' + esc(para).replace(PATH_RE, '<code>$&</code>').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function summaryOf(i) { return i.summary || i.title || '(untitled)'; }
  function tagsOf(i) { return i.tags || i.labels || []; }

  function card(i) {
    var status = i.status || '?', priority = i.priority || '?', type = i.type || '?';
    var el = document.createElement('article');
    el.className = 'card';
    el.id = 'i' + i.id;
    el.dataset.status = status;
    el.dataset.type = type;
    el.dataset.tags = tagsOf(i).join(' ');
    el.dataset.theme = i.theme || '';
    el.innerHTML =
      '<header><button class="row" aria-expanded="false">' +
      '<span class="id">#' + esc(i.id) + '</span>' +
      '<span class="summary">' + esc(summaryOf(i)) + '</span>' +
      '<span class="chips">' +
        '<span class="chip st-' + esc(status) + '">' + esc(status) + '</span>' +
        '<span class="chip pr-' + esc(priority) + '">' + esc(priority) + '</span>' +
        '<span class="chip ty">' + esc(type) + '</span>' +
        (i.theme ? '<span class="chip th">' + esc(i.theme) + '</span>' : '') +
      '</span><span class="caret" aria-hidden="true"></span></button></header>' +
      '<div class="body" hidden><div class="desc">' +
      markup(i.description || '(no description)') + '</div><footer>' +
      tagsOf(i).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
      '<span class="meta"><code>' + esc(i.file || '-') + '</code> &middot; created ' +
      esc(i.created || '?') + ' &middot; updated ' + esc(i.updated || '?') +
      '</span></footer></div>';
    el.querySelector('.row').addEventListener('click', function () {
      setOpen(el, el.querySelector('.body').hidden);
    });
    return el;
  }

  function setOpen(el, open) {
    el.querySelector('.row').setAttribute('aria-expanded', open);
    el.querySelector('.body').hidden = !open;
  }

  // The roadmap stores only rank, id and why. Everything shown here is joined
  // from the tracker, so an entry pointing at a missing or finished issue is
  // visibly wrong rather than quietly stale.
  function drawRoadmap(plan, byId) {
    if (!plan.length) return;
    var host = document.getElementById('plan');
    plan.slice().sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); })
      .forEach(function (e) {
        var issue = byId[e.id];
        var li = document.createElement('li');
        li.className = 'step';
        var head, warn = '';
        if (!issue) {
          head = '#' + esc(e.id) + ' is not in the tracker';
          warn = 'no such issue';
          li.className += ' bad';
        } else {
          head = '<a href="#i' + esc(e.id) + '">#' + esc(e.id) + ' ' +
                 esc(summaryOf(issue)) + '</a> <span class="chip st-' +
                 esc(issue.status) + '">' + esc(issue.status) + '</span>';
          if (LIVE.indexOf(issue.status) === -1) {
            warn = 'already ' + issue.status + ', take it off the roadmap';
            li.className += ' bad';
          }
        }
        li.innerHTML = '<span class="rank">' + esc(e.rank || '?') + '.</span>' +
          '<span class="what">' + head +
          '<span class="why">' + esc(e.why || '') + '</span>' +
          (warn ? '<span class="warn">' + esc(warn) + '</span>' : '') + '</span>';
        var link = li.querySelector('a');
        if (link) {
          link.addEventListener('click', function () {
            var target = document.getElementById('i' + e.id);
            if (target) { target.hidden = false; setOpen(target, true); }
          });
        }
        host.appendChild(li);
      });
    document.getElementById('roadmap').hidden = false;
  }

  function pills(host, filter, values, counts, limit) {
    var hidden = (limit && values.length > limit) ? values.length - limit : 0;
    document.getElementById(host).innerHTML = values.map(function (v, idx) {
      var extra = hidden && idx >= limit;
      return '<button class="pill' + (extra ? ' extra' : '') + '"' +
        (extra ? ' hidden' : '') +
        ' data-filter="' + filter + '" data-value="' + esc(v) + '">' +
        esc(v) + (counts ? ' <span class="n">' + counts[v] + '</span>' : '') + '</button>';
    }).join('') + (hidden
      ? '<button class="morebtn" data-host="' + host + '">+' + hidden + ' more</button>'
      : '');
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ active: active, q: q.value }));
    } catch (e) {}
  }

  function apply() {
    var needle = q.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.children, function (el) {
      var ok =
        (!active.status.length || active.status.indexOf(el.dataset.status) !== -1) &&
        (!active.type.length || active.type.indexOf(el.dataset.type) !== -1) &&
        (!active.theme.length || active.theme.indexOf(el.dataset.theme) !== -1) &&
        (!active.tag.length || active.tag.some(function (t) {
          return el.dataset.tags.split(' ').indexOf(t) !== -1;
        })) &&
        (!needle || el.textContent.toLowerCase().indexOf(needle) !== -1);
      el.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
    count.textContent = shown + ' of ' + issues.length + ' shown';
    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.setAttribute('aria-pressed', active[p.dataset.filter].indexOf(p.dataset.value) !== -1);
    });
    save();
  }

  function draw(data, plan, note) {
    issues = data.slice().sort(function (a, b) {
      return rank(a.status, STATUS_ORDER) - rank(b.status, STATUS_ORDER) ||
             rank(a.priority, PRIORITY_ORDER) - rank(b.priority, PRIORITY_ORDER) ||
             (a.id || 0) - (b.id || 0);
    });

    var counts = {}, byId = {};
    STATUS_ORDER.forEach(function (s) { counts[s] = 0; });
    issues.forEach(function (i) {
      counts[i.status] = (counts[i.status] || 0) + 1;
      byId[i.id] = i;
    });

    list.innerHTML = '';
    issues.forEach(function (i) { list.appendChild(card(i)); });
    drawRoadmap(plan || [], byId);

    pills('f-status', 'status', STATUS_ORDER.filter(function (s) { return counts[s]; }), counts);
    pills('f-type', 'type', unique(issues.map(function (i) { return i.type || '?'; })));

    var themeCounts = {};
    issues.forEach(function (i) {
      if (i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1;
    });
    var themes = THEME_ORDER.filter(function (t) { return themeCounts[t]; })
      .concat(Object.keys(themeCounts).filter(function (t) {
        return THEME_ORDER.indexOf(t) === -1;
      }).sort());
    document.getElementById('f-theme').parentNode.hidden = !themes.length;
    pills('f-theme', 'theme', themes, themeCounts);
    // A project can accumulate hundreds of tags, most of them used once.
    // Showing every one buries the results, so lead with the most used and
    // keep the long tail behind a toggle.
    var tagCounts = {};
    issues.forEach(function (i) {
      tagsOf(i).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    var tagNames = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || (a < b ? -1 : a > b ? 1 : 0);
    });
    pills('f-tag', 'tag', tagNames, tagCounts, TAG_PILL_LIMIT);

    [].forEach.call(document.querySelectorAll('.pill'), function (p) {
      p.addEventListener('click', function () {
        var l = active[p.dataset.filter], i = l.indexOf(p.dataset.value);
        if (i === -1) l.push(p.dataset.value); else l.splice(i, 1);
        apply();
      });
    });

    [].forEach.call(document.querySelectorAll('.morebtn'), function (b) {
      b.addEventListener('click', function () {
        var host = document.getElementById(b.dataset.host);
        var extras = host.querySelectorAll('.pill.extra');
        var show = extras.length && extras[0].hidden;
        [].forEach.call(extras, function (p) { p.hidden = !show; });
        b.textContent = show ? 'fewer' : '+' + extras.length + ' more';
      });
    });

    var open = (counts.open || 0) + (counts['in-progress'] || 0);
    document.getElementById('lede').innerHTML =
      issues.length + ' issues, ' + open + ' of them still open' +
      ((plan && plan.length) ? ', ' + plan.length + ' on the roadmap' : '') +
      '. Read from <code>issues.jsonl</code>.';
    if (note) {
      var n = document.getElementById('note');
      n.textContent = note;
      n.hidden = false;
    }

    try {
      var s = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (s.active) active = s.active;
      if (s.q) q.value = s.q;
    } catch (e) {}

    apply();

    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target && target.classList.contains('card')) {
        target.hidden = false;
        setOpen(target, true);
        target.scrollIntoView();
      }
    }
  }

  function unique(a) {
    return a.filter(function (v, i) { return a.indexOf(v) === i; }).sort();
  }

  q.addEventListener('input', apply);
  document.getElementById('reset').addEventListener('click', function () {
    active = { status: [], type: [], tag: [], theme: [] };
    q.value = '';
    apply();
  });
  document.getElementById('expand').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { if (!c.hidden) setOpen(c, true); });
  });
  document.getElementById('collapse').addEventListener('click', function () {
    [].forEach.call(list.children, function (c) { setOpen(c, false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; apply(); }
  });

  function lines(text) {
    return text.split('\n').filter(function (l) { return l.trim(); }).map(JSON.parse);
  }

  function grab(name) {
    return fetch(name, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(lines);
  }

  // The live files first. Browsers refuse a file:// fetch, so fall back to the
  // snapshot baked in at build time and say which one is on screen. A missing
  // roadmap.jsonl is not an error: the section just stays hidden.
  grab('issues.jsonl')
    .then(function (data) {
      grab('roadmap.jsonl')
        .catch(function () { return []; })
        .then(function (plan) { draw(data, plan); });
    })
    .catch(function () {
      var snap = JSON.parse(document.getElementById('snapshot').textContent);
      draw(snap.issues, snap.roadmap,
        'Showing the snapshot saved when this page was last built, because the browser would ' +
        'not read the .jsonl files from disk. To see them live, serve the directory ' +
        '(python3 -m http.server) and open it over http, or rebuild this page.');
