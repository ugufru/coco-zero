<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A modern computer runs a CoCo emulator on top of a dozen layers of software. A CoCo Zero runs a CoCo emulator, such as XRoar, straight on the hardware.</title>

  <rect width="900" height="640" rx="12" fill="#f6f8fa"/>

  <g font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">
    <text x="240" y="50">A CoCo emulator on a modern computer</text>
    <text x="660" y="50">A CoCo Zero</text>
  </g>
  <path d="M450 30V610" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- left: the stack, bottom to top -->
  <g font-size="15" text-anchor="middle">
    <rect x="60" y="566" width="360" height="34" rx="5" fill="#57606a"/>
    <text x="240" y="588" fill="#ffffff">Hardware</text>
    <rect x="60" y="526" width="360" height="34" rx="5" fill="#8c959f"/>
    <text x="240" y="548" fill="#ffffff">Firmware (UEFI)</text>
    <rect x="60" y="486" width="360" height="34" rx="5" fill="#8c959f"/>
    <text x="240" y="508" fill="#ffffff">Bootloader</text>
    <rect x="60" y="446" width="360" height="34" rx="5" fill="#8c959f"/>
    <text x="240" y="468" fill="#ffffff">Kernel</text>
    <rect x="60" y="406" width="360" height="34" rx="5" fill="#afb8c1"/>
    <text x="240" y="428" fill="#1f2328">Device drivers</text>
    <rect x="60" y="366" width="360" height="34" rx="5" fill="#afb8c1"/>
    <text x="240" y="388" fill="#1f2328">System services and daemons</text>
    <rect x="60" y="326" width="360" height="34" rx="5" fill="#afb8c1"/>
    <text x="240" y="348" fill="#1f2328">Login, users and permissions</text>
    <rect x="60" y="286" width="360" height="34" rx="5" fill="#d0d7de"/>
    <text x="240" y="308" fill="#1f2328">Display server and compositor</text>
    <rect x="60" y="246" width="360" height="34" rx="5" fill="#d0d7de"/>
    <text x="240" y="268" fill="#1f2328">Desktop and window manager</text>
    <rect x="60" y="206" width="360" height="34" rx="5" fill="#d0d7de"/>
    <text x="240" y="228" fill="#1f2328">Libraries and runtimes</text>
    <rect x="60" y="166" width="360" height="34" rx="5" fill="#d0d7de"/>
    <text x="240" y="188" fill="#1f2328">Updaters, indexers, notifications</text>
    <rect x="60" y="126" width="360" height="34" rx="5" fill="#2da44e"/>
    <text x="240" y="148" fill="#ffffff">Emulator app</text>
    <rect x="60" y="86" width="360" height="34" rx="5" fill="#1f2328"/>
    <text x="240" y="108" fill="#ffffff" font-family="SFMono-Regular, Menlo, Consolas, monospace">CoCo</text>
  </g>

  <!-- right: the CoCo Zero -->
  <rect x="480" y="86" width="360" height="394" rx="5" fill="none" stroke="#afb8c1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="660" y="280" font-size="34" font-weight="700" fill="#57606a" text-anchor="middle">Zero extra.</text>
  <text x="660" y="312" font-size="15" fill="#57606a" text-anchor="middle">No operating system, no drivers, no desktop.</text>

  <g font-size="15" text-anchor="middle">
    <rect x="480" y="486" width="360" height="74" rx="5" fill="#2da44e"/>
    <text x="660" y="516" fill="#ffffff" font-weight="600">CoCo Emulator (XRoar)</text>
    <text x="660" y="540" fill="#ffffff">and Configuration</text>
    <rect x="480" y="566" width="360" height="34" rx="5" fill="#57606a"/>
    <text x="660" y="588" fill="#ffffff">Hardware</text>
  </g>
</svg>
